version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semantic-rag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: semantic_rag_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d semantic_rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: semantic-rag-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: semantic-rag-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-05-03T11-21-34Z
    container_name: semantic-rag-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb localminio/semantic-rag-uploads --ignore-existing;
      /usr/bin/mc anonymous set download localminio/semantic-rag-uploads;
      exit 0;
      "

  redis:
    image: redis:7.2-alpine
    container_name: semantic-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tika:
    image: apache/tika:2.9.2.0-full
    container_name: semantic-rag-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

