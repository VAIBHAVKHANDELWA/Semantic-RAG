server:
  port: 8080

spring:
  application:
    name: java-gateway
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: adminpassword
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000ms
  datasource:
    url: jdbc:postgresql://localhost:5432/semantic_rag_db
    username: admin
    password: adminpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: aXRzLWEtc2VjcmV0LWtleS10aGF0LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZw==

cloud:
  s3:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: semantic-rag-uploads
    region: us-east-1

logging:
  level:
    root: INFO
    com.middleware.gateway: DEBUG
    org.springframework.security: DEBUG
